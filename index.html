<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hours Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2b22;--mu:#6b7a70;--ac:#2f6b45;--bd:#dfe4dd;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2620;--tx:#e8efe9;--mu:#93a398;--ac:#6fbf8b;--bd:#2f3b33;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d2620;--tx:#e8efe9;--mu:#93a398;--ac:#6fbf8b;--bd:#2f3b33;--er:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}
p.mu,.mu{color:var(--mu);font-size:.9rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.lnk{background:none;color:var(--er);padding:2px 6px}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{color:var(--er);font-size:.9rem;min-height:1.2em;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 0}
.ok{color:var(--ac);font-size:.9rem;margin-top:8px}
.hide{display:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
</style>
</head>
<body>
<main>
<section id="signin" class="card">
  <h1>Hours Tracker</h1>
  <p class="mu">Sign in with your email and a 4-digit PIN. First time? Entering a new email creates your account.</p>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="pin">4-digit PIN</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
  <div class="err" id="serr"></div>
  <button id="go" style="width:100%;margin-top:8px">Sign in</button>
</section>

<section id="app" class="hide">
  <div class="top"><div><h1>Hours Tracker</h1><div class="mu" id="who"></div></div><button class="sec" id="out">Sign out</button></div>

  <div class="card">
    <h2>Add hours to cart</h2>
    <div class="row">
      <div><label for="dt">Date</label><input id="dt" type="date"></div>
      <div><label for="hr">Hours</label><input id="hr" type="number" min="0.25" max="24" step="0.25" placeholder="e.g. 3.5"></div>
    </div>
    <label for="nt">Note (optional)</label>
    <input id="nt" type="text" placeholder="What did you work on?">
    <div class="err" id="aerr"></div>
    <button id="add" style="margin-top:8px">Add to cart</button>
  </div>

  <div class="card">
    <h2>Cart</h2>
    <div id="cart"></div>
    <div class="tot"><span>Total hours</span><span id="tot">0</span></div>
    <button id="sub" style="width:100%">Submit hours</button>
    <div class="ok" id="ok"></div>
  </div>

  <div class="card">
    <h2>Submitted hours</h2>
    <p class="mu">Everything you've submitted. Entries also go to the Google Sheet when you submit.</p>
    <div class="scroll"><table id="hist"></table></div>
    <button class="sec" id="exp" style="margin-top:12px">Download spreadsheet (.csv)</button>
  </div>
</section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var SHEET_URL="https://script.google.com/macros/s/AKfycbygujmbERCPxJbvFrGaPSx1CzC2RrzA7-osDveVU9wJWAJ9ivcvWDrjN6D92IVyRv-a/exec"; // Google Apps Script web app URL
  var KEY_USERS="ht_users", KEY_DATA="ht_data_";
  var email=null, pin=null, cart=[], hist=[];

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  var mem={}; // fallback if storage is unavailable
  function users(){return load(KEY_USERS,mem.users||{})}

  $("go").onclick=function(){
    var e=$("em").value.trim().toLowerCase(), p=$("pin").value;
    if(!/^\S+@\S+\.\S+$/.test(e)){$("serr").textContent="Enter a valid email.";return}
    if(!/^\d{4}$/.test(p)){$("serr").textContent="PIN must be exactly 4 digits.";return}
    var u=users();
    if(u[e]===undefined){u[e]=p;save(KEY_USERS,u);mem.users=u}
    else if(u[e]!==p){$("serr").textContent="Incorrect PIN for that email.";return}
    $("serr").textContent="";$("pin").value="";
    email=e;pin=p;cart=[];hist=load(KEY_DATA+e,[]);
    $("signin").classList.add("hide");$("app").classList.remove("hide");
    $("who").textContent=e;$("dt").value=new Date().toISOString().slice(0,10);
    render();
  };
  $("pin").addEventListener("keydown",function(ev){if(ev.key==="Enter")$("go").click()});
  $("out").onclick=function(){email=null;cart=[];$("app").classList.add("hide");$("signin").classList.remove("hide");$("ok").textContent=""};

  $("add").onclick=function(){
    var d=$("dt").value,h=parseFloat($("hr").value);
    if(!d){$("aerr").textContent="Pick a date.";return}
    if(!(h>0&&h<=24)){$("aerr").textContent="Enter hours between 0.25 and 24.";return}
    $("aerr").textContent="";$("ok").textContent="";
    cart.push({date:d,hours:h,note:$("nt").value.trim()});
    $("hr").value="";$("nt").value="";render();
  };

  function render(){
    var c=$("cart");
    c.innerHTML=cart.length?cart.map(function(x,i){
      return '<div class="item"><span>'+esc(x.date)+' &middot; <b>'+x.hours+' h</b>'+(x.note?' &middot; <span class="mu">'+esc(x.note)+'</span>':'')+'</span><button class="lnk" data-i="'+i+'">Remove</button></div>';
    }).join(""):'<p class="mu">Your cart is empty.</p>';
    c.querySelectorAll("button").forEach(function(b){b.onclick=function(){cart.splice(+b.dataset.i,1);render()}});
    $("tot").textContent=cart.reduce(function(s,x){return s+x.hours},0);
    $("hist").innerHTML=hist.length?'<tr><th>Date</th><th>Hours</th><th>Note</th><th>Submitted</th></tr>'+hist.map(function(x){
      return '<tr><td>'+esc(x.date)+'</td><td>'+x.hours+'</td><td>'+esc(x.note)+'</td><td>'+esc(x.submitted.slice(0,16).replace("T"," "))+'</td></tr>'}).join(""):'<tr><td class="mu">Nothing submitted yet.</td></tr>';
  }

  function csv(rows){
    var q=function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var lines=[["Email","Date","Hours","Note","Submitted"]].concat(rows.map(function(r){return [email,r.date,r.hours,r.note,r.submitted]}));
    return lines.map(function(l){return l.map(q).join(",")}).join("\r\n");
  }
  function download(rows,name){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv(rows)],{type:"text/csv"}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
  }
  function sendToSheet(batch){
    if(SHEET_URL.indexOf("PASTE_")===0){$("ok").textContent="Saved locally. Add your Google Sheets URL in the code to send to the sheet.";return}
    var rows=batch.map(function(r){return [r.date,r.hours,r.note,r.submitted]});
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({email:email,pin:pin,rows:rows})})
      .then(function(){$("ok").textContent="Submitted and sent to the Google Sheet!"})
      .catch(function(){$("ok").textContent="Saved here, but couldn't reach the sheet. Check your connection."});
  }

  $("sub").onclick=function(){
    if(!cart.length){$("ok").textContent="Add at least one entry first.";return}
    var now=new Date().toISOString(), batch=cart.map(function(x){return{date:x.date,hours:x.hours,note:x.note,submitted:now}});
    hist=hist.concat(batch);save(KEY_DATA+email,hist);cart=[];render();
    $("ok").textContent="Sending...";
    sendToSheet(batch);
  };
  $("exp").onclick=function(){
    if(!hist.length){$("ok").textContent="Nothing to export yet.";return}
    download(hist,"all-hours.csv");
  };
})();
</script>
</body>
</html>
